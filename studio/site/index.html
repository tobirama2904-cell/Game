<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>СТУДИЯ • Четыре истории — трейлеры и аудиокниги</title>
<style>
  @font-face{font-family:'Oswald';src:url('fonts/Oswald.ttf');}
  @font-face{font-family:'RussoOne';src:url('fonts/RussoOne.ttf');}
  @font-face{font-family:'Yeseva';src:url('fonts/Yeseva.ttf');}
  :root{--bg:#07090c;--panel:#0d1117;--line:#1c2430;--txt:#e8ecf3;--dim:#8b96a8;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:'Oswald',system-ui,sans-serif;
       background-image:radial-gradient(1200px 500px at 50% -10%,#12202c55,transparent);}
  header{padding:56px 24px 28px;text-align:center}
  header .kick{letter-spacing:.55em;color:var(--dim);font-size:12px;text-transform:uppercase}
  header h1{font-family:'RussoOne';font-size:clamp(28px,5vw,54px);letter-spacing:.12em;margin-top:14px;
            text-shadow:0 0 34px #6fb7d833}
  header p{color:var(--dim);margin-top:10px;font-size:15px;letter-spacing:.08em}
  main{max-width:1180px;margin:0 auto;padding:12px 20px 90px}
  h2{font-size:13px;letter-spacing:.42em;color:var(--dim);text-transform:uppercase;margin:44px 0 18px;
     display:flex;align-items:center;gap:14px}
  h2:after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;
        transition:transform .25s,border-color .25s,box-shadow .25s;cursor:pointer;position:relative}
  .card:hover{transform:translateY(-4px);border-color:#33465c;box-shadow:0 18px 50px -18px #000c}
  .thumb{aspect-ratio:16/9;background:#000 center/cover no-repeat;position:relative}
  .thumb:after{content:'▶';position:absolute;inset:0;display:grid;place-items:center;font-size:44px;
               color:#ffffffd9;text-shadow:0 0 30px #000;opacity:.85;transition:.25s}
  .card:hover .thumb:after{transform:scale(1.12);opacity:1}
  .thumb .dur{position:absolute;right:10px;bottom:10px;background:#000a;padding:3px 8px;border-radius:6px;
              font-size:12px;letter-spacing:.1em;color:#dfe6f0}
  .meta{padding:14px 16px 16px}
  .meta h3{font-size:19px;letter-spacing:.06em}
  .meta .sub{color:var(--dim);font-size:13px;margin-top:5px;letter-spacing:.04em;font-family:system-ui}
  .meta .genre{display:inline-block;margin-top:10px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;
               padding:4px 10px;border:1px solid var(--line);border-radius:99px;color:var(--dim)}
  .bar{height:3px;background:var(--line);border-radius:2px;margin-top:12px;overflow:hidden}
  .bar i{display:block;height:100%;width:38px;border-radius:2px}
  /* audiobook rows */
  .chap{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);
        border-radius:12px;padding:12px 16px;margin-bottom:10px}
  .chap .n{font-family:'RussoOne';color:var(--dim);font-size:13px;min-width:34px}
  .chap .t{flex:1;font-size:15px;letter-spacing:.04em}
  .chap audio{height:36px;width:300px;filter:invert(.9) hue-rotate(180deg)}
  .empty{color:var(--dim);border:1px dashed var(--line);border-radius:12px;padding:26px;text-align:center;
         font-size:14px;letter-spacing:.06em}
  /* modal */
  .modal{position:fixed;inset:0;background:#000d;backdrop-filter:blur(6px);display:none;place-items:center;z-index:50;padding:24px}
  .modal.on{display:grid}
  .modal .box{width:min(1100px,96vw)}
  .modal video{width:100%;border-radius:12px;box-shadow:0 30px 90px -30px #000}
  .modal .cap{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--dim);font-size:13px;letter-spacing:.1em}
  .modal .x{cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:6px 14px;color:var(--txt)}
  footer{color:#5b6678;text-align:center;padding:30px;font-size:12px;letter-spacing:.18em}
</style>
</head>
<body>
<header>
  <div class="kick">студия arena • производственный цикл 2026</div>
  <h1>ЧЕТЫРЕ ИСТОРИИ</h1>
  <p>трейлеры с озвучкой • аудиокниги • процедурный саундтрек • «Хроники Искры» · «Костяной прилив» · «Странник» · «Разлом»</p>
</header>
<main>
  <h2>Трейлеры</h2>
  <div class="grid" id="trailers"></div>
  <h2>Аудиокнига «Странник»</h2>
  <div id="audiobook"></div>
</main>
<div class="modal" id="modal">
  <div class="box">
    <video id="player" controls playsinline></video>
    <div class="cap"><span id="captitle"></span><span class="x" onclick="closeM()">закрыть ✕</span></div>
  </div>
</div>
<footer>СИСТЕМА ГОЛОСОВ: 8 РОЛЕЙ • САУНДТРЕК СИНТЕЗИРОВАН С НУЛЯ • 1080p 24fps</footer>
<script>
const el = id => document.getElementById(id);
fetch('manifest.json').then(r=>r.json()).then(m=>{
  el('trailers').innerHTML = m.trailers.map(t=>`
    <div class="card" onclick="play('${t.file}', '${t.title.replace(/'/g,'')} — ${t.sub.replace(/'/g,'')}')">
      <div class="thumb" style="background-image:url('${t.poster||''}')">
        <span class="dur">${t.size} MB</span>
      </div>
      <div class="meta"><h3>${t.title}</h3><div class="sub">${t.sub}</div>
      <span class="genre">${t.genre}</span><div class="bar"><i style="background:${t.color}"></i></div></div>
    </div>`).join('') || '<div class="empty">трейлеры рендерятся…</div>';
  const ab = m.audiobook.find(b=>b.id==='strannik');
  el('audiobook').innerHTML = ab ? ab.chapters.map((c,i)=>`
    <div class="chap"><span class="n">${String(i+1).padStart(2,'0')}</span>
    <span class="t">${c.title}</span><audio controls preload="none" src="${c.file}"></audio></div>`).join('')
    : '<div class="empty">главы аудиокниги появятся после озвучки — производственный конвейер запущен</div>';
});
function play(src, title){ el('player').src = src; el('captitle').textContent = title; el('modal').classList.add('on'); el('player').play(); }
function closeM(){ el('modal').classList.remove('on'); el('player').pause(); }
el('modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeM(); });
</script>
</body>
</html>
